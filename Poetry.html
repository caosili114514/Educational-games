<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>诗词飞花 · 高考古诗词闯关</title>
<style>
:root{--ink:#241f19;--ink2:#6b6152;--paper:#f8f2e4;--seal:#b0362c;--seal2:#8d2a21;--jade:#4e6b62;--gold:#a9894c;--line:#e0d2b6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Kaiti SC","STKaiti","KaiTi","楷体","Songti SC",serif;color:var(--ink);background:radial-gradient(1200px 700px at 12% -12%,#fffdf7,#f4ecda 55%,#ece0c6) fixed;min-height:100vh;font-size:16px}
body::after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;background-image:radial-gradient(#c8b795 .6px,transparent .6px);background-size:5px 5px}
header{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,rgba(250,245,233,.97),rgba(244,236,218,.94));border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.wrap{max-width:1060px;margin:0 auto;padding:8px 14px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;cursor:pointer}
.seal{width:42px;height:42px;background:linear-gradient(145deg,var(--seal),var(--seal2));color:#fff;border-radius:8px;display:grid;place-items:center;font-size:22px;box-shadow:0 3px 8px rgba(140,40,30,.35);transform:rotate(-5deg)}
.brand b{font-size:19px;letter-spacing:3px}
.brand small{display:block;font-size:11px;color:var(--ink2);letter-spacing:1px}
nav{display:flex;gap:4px;flex:1;overflow-x:auto}
nav button{border:1px solid transparent;background:none;font-family:inherit;font-size:14px;color:var(--ink2);padding:6px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}
nav button.on,nav button:hover{background:#fff;border-color:var(--line);color:var(--seal)}
.hud{display:flex;align-items:center;gap:6px}
.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;white-space:nowrap}
.chip.hot{background:#fdeceb;border-color:#e8b4ad;color:var(--seal)}
main{max-width:1060px;margin:0 auto;padding:14px}
.screen{display:none}
.screen.on{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.scroll{position:relative;background:linear-gradient(180deg,#fffdf8,#f7efdd);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 26px rgba(90,70,40,.10),inset 0 0 30px rgba(180,150,100,.08);padding:16px;margin:16px 0}
.scroll::before,.scroll::after{content:"";position:absolute;left:8px;right:8px;height:7px;border-radius:6px;background:linear-gradient(90deg,#c9ab7d,#8a6a44,#c9ab7d)}
.scroll::before{top:-4px}.scroll::after{bottom:-4px}
h1,h2,h3{margin:0 0 8px}
.ttl{font-size:26px;letter-spacing:6px;text-align:center;text-shadow:0 2px 0 #fff,0 3px 10px rgba(120,90,50,.25)}
.sub{text-align:center;color:var(--ink2);font-size:13px;letter-spacing:2px}
.btn{font-family:inherit;font-size:15px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:linear-gradient(#fffdf8,#f2e8d3);cursor:pointer;color:var(--ink);transition:.15s}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:linear-gradient(#c04a3c,#a33226);border-color:#8d2a21;color:#fff}
.btn.jade{background:linear-gradient(#5c8074,#43625a);border-color:#3b574f;color:#fff}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.grid{display:grid;gap:12px}
.modes{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.mode{background:linear-gradient(180deg,#fffdf8,#f6ecda);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;transition:.18s;position:relative;overflow:hidden}
.mode:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(110,80,40,.15)}
.mode .ic{font-size:26px}
.mode b{display:block;font-size:17px;margin:6px 0 3px;letter-spacing:2px}
.mode p{margin:0;font-size:12.5px;color:var(--ink2);line-height:1.6}
.lv{cursor:pointer;position:relative}
.lv.lock{filter:grayscale(.8);opacity:.6;cursor:not-allowed}
.stars{color:var(--gold);letter-spacing:2px;font-size:14px}
.tag{display:inline-block;font-size:11.5px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:2px 9px;margin:0 6px 6px 0;color:var(--ink2)}
.qstem{font-size:19px;line-height:1.95;padding:6px 2px 14px;border-bottom:1px dashed var(--line);margin-bottom:12px}
.opts{display:grid;gap:9px}
.opt{text-align:left;font-family:inherit;font-size:16px;line-height:1.6;padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;transition:.15s}
.opt:hover{border-color:#c9a97a;background:#fdf9ef}
.opt.sel{border-color:var(--seal);background:#fdeceb}
.opt.right{border-color:#4e8b6b;background:#eef7f0}
.opt.wrong{border-color:#b0362c;background:#fdeceb;text-decoration:line-through;opacity:.75}
.opt.gone{opacity:.3;pointer-events:none}
.fill{width:100%;font-family:inherit;font-size:17px;padding:11px;border-radius:10px;border:1px solid var(--line);background:#fffdf7;resize:vertical;line-height:1.7}
.keyseal{width:78px;height:78px;margin:6px auto 12px;background:linear-gradient(145deg,var(--seal),var(--seal2));color:#fff;border-radius:12px;display:grid;place-items:center;font-size:40px;box-shadow:0 5px 14px rgba(140,40,30,.35);transform:rotate(-4deg)}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:44px;padding:8px;border:1px dashed var(--line);border-radius:10px;background:#fffdf7}
.slot{display:flex;flex-direction:column;gap:7px;min-height:56px;padding:8px;border:1px solid var(--line);border-radius:10px;background:#fffbf2;margin-top:8px}
.chipbtn{font-family:inherit;font-size:15px;padding:7px 11px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.col{display:flex;flex-direction:column;gap:8px}
.mitem{font-family:inherit;font-size:15px;text-align:left;padding:10px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer}
.mitem.on{border-color:var(--seal);background:#fdeceb}
.mitem.done{border-color:#9dc0a8;background:#f1f8f2}
.fb{margin-top:14px;border-radius:12px;padding:13px 14px;line-height:1.85;font-size:15px;border:1px solid var(--line);background:#fffdf7}
.fb.ok{border-color:#9dc0a8;background:#f2f9f3}
.fb.no{border-color:#e3b6b0;background:#fdf0ee}
.fb h4{margin:0 0 6px;font-size:17px}
.fb .kb{color:var(--seal)}
.bar{height:8px;border-radius:6px;background:#e8dcc4;overflow:hidden;margin:8px 0 4px}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#c9a97a,#b0362c);transition:.3s}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.lb{display:grid;grid-template-columns:52px 1fr 74px 58px 66px 66px;gap:4px;align-items:center;padding:9px 6px;border-bottom:1px dashed var(--line);font-size:14px}
.lb.head{font-size:12.5px;color:var(--ink2);border-bottom:1px solid var(--line)}
.lb.me{background:#fdf6e8;border-radius:8px;font-weight:bold}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:19px;background:#fff;border:1px solid var(--line)}
.badges{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(148px,1fr))}
.badge{text-align:center;padding:12px 8px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(180deg,#fffdf8,#f6ecda)}
.badge.lock{filter:grayscale(1);opacity:.45}
.badge .ic{font-size:30px}
.badge b{display:block;font-size:14.5px;margin:5px 0 3px;letter-spacing:1px}
.badge p{margin:0;font-size:11.5px;color:var(--ink2);line-height:1.6}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{font-family:inherit;font-size:14px;padding:7px 13px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer}
.tabs button.on{background:var(--seal);color:#fff;border-color:var(--seal2)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left}
th{color:var(--ink2);font-weight:normal;font-size:13px}
.avatar-pick{display:flex;gap:8px;flex-wrap:wrap}
.avatar-pick button{font-size:22px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer}
.avatar-pick button.on{border-color:var(--seal);background:#fdeceb}
.mask{position:fixed;inset:0;background:rgba(40,30,20,.45);display:none;place-items:center;z-index:99;padding:18px}
.mask.on{display:grid}
.modal{max-width:420px;width:100%;background:linear-gradient(180deg,#fffdf8,#f6ecda);border-radius:16px;padding:22px;text-align:center;border:1px solid var(--line);box-shadow:0 20px 50px rgba(60,40,20,.35);animation:pop .3s}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.modal .big{font-size:58px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:rgba(36,31,25,.92);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:120;opacity:0;transition:.3s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;bottom:40px}
.qact{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.wrongitem{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:9px;background:#fffdf7;font-size:14px;line-height:1.75}
.small{font-size:12.5px;color:var(--ink2)}
textarea.code{width:100%;min-height:90px;font-family:Consolas,monospace;font-size:12.5px;padding:9px;border-radius:9px;border:1px solid var(--line);background:#fff}
@media(max-width:640px){
 .ttl{font-size:21px;letter-spacing:3px}
 .lb{grid-template-columns:40px 1fr 62px 52px;font-size:12.5px}
 .lb span:nth-child(5),.lb span:nth-child(6){display:none}
 .qstem{font-size:17px}
 nav button{font-size:13px;padding:6px 8px}
 main{padding:10px}
}
</style>
</head>
<body>
<header><div class="wrap top">
  <div class="brand" onclick="go('home')">
    <div class="seal">詩</div>
    <div><b>诗词飞花</b><small>高考古诗词闯关</small></div>
  </div>
  <nav id="nav">
    <button data-s="home" class="on">首页</button>
    <button data-s="rank">排行榜</button>
    <button data-s="badge">徽章墙</button>
    <button data-s="wrong">错题本</button>
    <button data-s="me">个人主页</button>
    <button data-s="teach">教师后台</button>
  </nav>
  <div class="hud">
    <span class="chip" id="pts">0 分</span>
    <button class="chip" id="snd" onclick="toggleSound()" title="音效开关">🔊</button>
  </div>
</div></header>

<main>
<!-- 首页 -->
<section class="screen on" id="s-home">
  <div class="scroll">
    <div class="ttl">詩詞飛花</div>
    <div class="sub">统编版必修 · 选择性必修 · 高考必背 ／ 五关闯关 · 限时挑战 · 飞花令</div>
    <div id="home-tip" class="small" style="text-align:center;margin-top:10px"></div>
  </div>
  <div class="grid modes">
    <div class="mode" onclick="startLevel(0)"><div class="ic">🏮</div><b>闯关模式</b><p>五关递进：名句默写 → 情境默写 → 意象手法 → 作者作品 → 综合飞花令</p></div>
    <div class="mode" onclick="startLimit()"><div class="ic">⏱️</div><b>限时挑战</b><p>60秒随机答题，答对得分，答错不扣分但连击清零</p></div>
    <div class="mode" onclick="trainWrong()"><div class="ic">📕</div><b>错题重练</b><p>自动收录错题，反复练习，订正满30题得徽章</p></div>
    <div class="mode" onclick="startFeihua()"><div class="ic">🌸</div><b>飞花令</b><p>给关键字写诗句，连对5轮加冕"飞花令主"</p></div>
  </div>
  <div class="scroll">
    <h3>选择关卡</h3>
    <div class="grid modes" id="levels"></div>
    <div class="small" style="margin-top:8px">提示：正确率≥60%通关并解锁下一关，全对可获"满分状元"。</div>
  </div>
</section>

<!-- 答题页 -->
<section class="screen" id="s-quiz">
  <div class="scroll">
    <div class="qhead">
      <b id="q-title">闯关</b>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <span class="chip" id="q-prog">1/8</span>
        <span class="chip" id="q-combo">连击 0</span>
        <span class="chip" id="q-time">0.0s</span>
      </div>
    </div>
    <div class="bar"><i id="q-bar"></i></div>
    <div id="q-tags" style="margin-top:8px"></div>
    <div class="qstem" id="q-stem"></div>
    <div id="q-body"></div>
    <div class="qact">
      <button class="btn" id="b-hint" onclick="useHint()">💡 提示（得分减半）</button>
      <button class="btn primary" id="b-sub" onclick="submitAnswer()">提交答案</button>
      <button class="btn primary" id="b-next" style="display:none" onclick="nextQ()">下一题 →</button>
      <button class="btn ghost" onclick="quitQuiz()">退出</button>
    </div>
    <div id="fb"></div>
  </div>
</section>

<!-- 结算页 -->
<section class="screen" id="s-res"><div class="scroll" id="res-box"></div></section>

<!-- 排行榜 -->
<section class="screen" id="s-rank">
  <div class="scroll">
    <h3>排行榜</h3>
    <div class="tabs" id="rank-tabs">
      <button class="on" onclick="renderRank('class',this)">班级榜</button>
      <button onclick="renderRank('grade',this)">年级榜</button>
      <button onclick="renderRank('week',this)">周榜</button>
      <button onclick="renderRank('total',this)">总榜</button>
    </div>
    <div id="rank-body"></div>
    <div class="small" id="rank-note" style="margin-top:10px"></div>
  </div>
</section>

<!-- 徽章墙 -->
<section class="screen" id="s-badge">
  <div class="scroll">
    <h3>徽章墙 <span class="small" id="badge-num"></span></h3>
    <div class="badges" id="badge-list"></div>
  </div>
</section>

<!-- 错题本 -->
<section class="screen" id="s-wrong">
  <div class="scroll">
    <h3>错题本</h3>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
      <button class="btn primary" onclick="trainWrong()">开始重练</button>
      <button class="btn" onclick="clearWrong()">清空错题本</button>
      <span class="chip" id="wrong-num"></span>
    </div>
    <div id="wrong-list"></div>
  </div>
</section>

<!-- 个人主页 -->
<section class="screen" id="s-me"><div class="scroll" id="me-box"></div></section>

<!-- 教师后台 -->
<section class="screen" id="s-teach">
  <div class="scroll">
    <h3>教师后台</h3>
    <div class="tabs" id="ttabs">
      <button class="on" onclick="teachTab(0,this)">数据总览</button>
      <button onclick="teachTab(1,this)">关卡与分值</button>
      <button onclick="teachTab(2,this)">题库导入导出</button>
      <button onclick="teachTab(3,this)">成绩与排行</button>
      <button onclick="teachTab(4,this)">飞花令词库</button>
    </div>
    <div id="teach-body"></div>
  </div>
</section>
</main>

<div class="mask" id="mask" onclick="if(event.target.id==='mask')closeMask()"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ==================== 基础数据 ==================== */
const PTS={1:5,2:10,3:15};
const pad=n=>String(n).padStart(3,'0');
const Q=[];
function mkA(rows){rows.forEach((r,i)=>Q.push({id:'A'+pad(i+1),type:'上下句默写',level:1,poem:r[0],author:r[1],dynasty:r[2],stem:'补写名句：“'+r[3]+'”',options:null,answer:r[4],typos:r[5],tags:'名句默写·'+r[0],difficulty:r[7],points:PTS[r[7]],analysis:'出自《'+r[0]+'》（'+r[1]+'·'+r[2]+'）。原句：“'+r[3].replace('______',r[4])+'”。易错字：'+r[5]+'。'+r[6]+'。'}));}
function mkB(rows){rows.forEach((r,i)=>Q.push({id:'B'+pad(i+1),type:'情境默写',level:2,poem:r[0],author:r[1],dynasty:r[2],stem:r[3],options:null,answer:r[4],typos:r[5],tags:'情境默写·'+r[0],difficulty:r[7],points:PTS[r[7]],analysis:'出自《'+r[0]+'》（'+r[1]+'·'+r[2]+'）。原句：“'+r[4]+'”。易错字：'+r[5]+'。'+r[6]+'。'}));}
function mkQ(rows){rows.forEach((r,i)=>Q.push({id:'Q'+pad(i+1),type:r[1],level:r[0],poem:r[2],author:r[3],dynasty:r[4],stem:r[5],options:r[6],answer:r[7],analysis:r[8],typos:r[9],tags:r[10],difficulty:r[11],points:PTS[r[11]]}));}
function mkO(rows){rows.forEach((r,i)=>Q.push({id:'S'+pad(i+1),type:'诗句排序',level:r[0],poem:r[1],author:r[2],dynasty:r[3],stem:'请按原诗顺序依次点击下列诗句（点错可点击已选诗句移回）。',options:null,lines:r[4],answer:r[4].slice(),analysis:'出自《'+r[1]+'》（'+r[2]+'·'+r[3]+'）。正确顺序：'+r[4].join('／')+'。注意诗句间的承接与对仗关系。',typos:'语序',tags:'诗句排序·'+r[1],difficulty:r[5],points:PTS[r[5]]}));}
function mkL(rows){rows.forEach((r,i)=>Q.push({id:'L'+pad(i+1),type:'作者作品连线',level:4,poem:'文学常识',author:'—',dynasty:'—',stem:'请把下列作者与其代表作品一一连线。',options:null,pairs:r[0],answer:r[0].slice(),analysis:r[1],typos:'—',tags:'作者作品·连线',difficulty:r[2],points:PTS[r[2]]}));}
function mkF(rows){rows.forEach((r,i)=>Q.push({id:'F'+pad(i+1),type:'飞花令',level:5,poem:'飞花令',author:'—',dynasty:'—',stem:'请写出含“'+r[0]+'”字的诗句（课内常见名句，任意一句即可）。',options:null,answer:r[0],key:r[0],analysis:'飞花令：含“'+r[0]+'”的名句很多，如“'+r[1]+'”。注意默写准确，错字不得分。',typos:r[0],tags:'飞花令·'+r[0],difficulty:r[2],points:PTS[r[2]]}));}

/* ---------- 上下句默写（第一关） ---------- */
mkA([
['劝学','荀子','战国','锲而舍之，朽木不折；锲而不舍，______。','金石可镂','镂','以雕刻设喻，强调坚持不懈',2],
['劝学','荀子','战国','故不积跬步，无以至千里；不积小流，______。','无以成江海','跬、至','以行路设喻，强调积累',2],
['劝学','荀子','战国','青，取之于蓝，______。','而青于蓝','蓝','以靛青为喻，说明学习可以提高自己',1],
['劝学','荀子','战国','君子生非异也，______。','善假于物也','生、假','“生”通“性”，强调善于借助外物',2],
['师说','韩愈','唐','是故无贵无贱，无长无少，道之所存，______。','师之所存也','贱','提出择师标准，打破门第观念',2],
['师说','韩愈','唐','位卑则足羞，______。','官盛则近谀','谀','批判士大夫之族耻学于师',3],
['师说','韩愈','唐','是故弟子不必不如师，师不必贤于弟子，闻道有先后，______，如是而已。','术业有专攻','攻','说明弟子不必不如师',2],
['赤壁赋','苏轼','宋','白露横江，水光接天。纵一苇之所如，______。','凌万顷之茫然','凌、顷','写泛舟江上的开阔境界',3],

 }else if(q.type==='诗句排序'){
  picked=[];renderOrder();
 }else if(q.type==='作者作品连线'){
  const left=q.pairs.map((p,i)=>({t:p[0],i}));
  const right=shuffle(q.pairs.map((p,i)=>({t:p[1],i})));
  S._left=left;S._right=right;link={};selLeft=null;renderMatch();
 }
 startTimer();
}

function startTimer(){
 qStart=Date.now();clearInterval(timer);
 timer=setInterval(()=>{
  const s=(Date.now()-qStart)/1000;
  if(S.mode==='limit'){
   const left=Math.max(0,(deadline-Date.now())/1000);
   $('#q-time').textContent='剩余 '+left.toFixed(1)+'s';
   if(left<=0){clearInterval(timer);endSession(true);return;}
  }else $('#q-time').textContent=s.toFixed(1)+'s';
 },100);

/* ==================== 判分 ==================== */
function clauses(s){return String(s||'').replace(/[\s，。、；：？！,.;:?!“”‘’"'（）()《》]/g,'|').split('|').filter(x=>x.length>=2);}
function fillMatch(u,a){
 const U=norm(u);if(!U)return false;
 const A=clauses(a);
 if(!A.length)return U===norm(a);
 return A.every(p=>U.includes(norm(p)));
}
function fhCheck(txt,key){
 const U=norm(txt);if(!U||!U.includes(key))return false;
 const parts=U.split(/[，。、；：？！,.;:?!\s]+/).filter(x=>x.length>=4);
 const lines=allLines();
 for(const p of parts){
  if(!p.includes(key))continue;
  for(const l of lines){
   if(l===p)return true;
   if(p.length>=6&&l.includes(p))return true;
   if(l.length>=6&&p.includes(l))return true;
  }
 }
 return false;
}
function isRight(q){
 switch(q.type){
  case '理解性选择':case '意象判断':case '手法辨析':case '作者作品':case '名句纠错':return pending===q.answer;
  case '上下句默写':case '情境默写':return fillMatch($('#fill')?$('#fill').value:'',q.answer);
  case '飞花令':return fhCheck($('#fill')?$('#fill').value:'',q.key);
  case '诗句排序':return picked.length===q.lines.length&&picked.every((v,i)=>v===i);
  case '作者作品连线':return q.pairs.every((p,i)=>link[i]===i)&&Object.keys(link).length===q.pairs.length;
 }
 return false;
}
function calcScore(q,sec,combo,hint){
 let base=q.points||PTS[q.difficulty],sp=sec<=5?5:sec<=10?3:0,cb=combo>=8?20:combo===5?10:combo===3?5:0;
 let t=base+sp+cb;if(hint)t=Math.floor(t/2);
 return {base,sp,cb,total:t,hint:!!hint};
}
function submitAnswer(){
 if(answerLocked)return;
 const q=S.queue[S.idx];
 const fill=$('#fill');
 if(['上下句默写','情境默写','飞花令'].includes(q.type)&&(!fill||!norm(fill.value))){toast('请先输入答案');return;}
 if(q.type==='理解性选择'||q.type==='作者作品'||q.type==='意象判断'||q.type==='手法辨析'||q.type==='名句纠错'){if(pending==null){toast('请先选择一个选项');return;}}
 if(q.type==='诗句排序'&&picked.length<q.lines.length){toast('请把诗句全部排序');return;}
 if(q.type==='作者作品连线'&&Object.keys(link).length<q.pairs.length){toast('请完成全部连线');return;}
 answerLocked=true;clearInterval(timer);
 const sec=(Date.now()-qStart)/1000;
 const ok=isRight(q);
 let got=0,detail='';
 /* 展示判分结果 */
 if(['理解性选择','意象判断','手法辨析','作者作品','名句纠错'].includes(q.type)){
  $$('.opt').forEach((e,k)=>{e.classList.remove('sel');if(k===q.answer)e.classList.add('right');if(k===pending&&!ok)e.classList.add('wrong');});
 }else if(q.type==='诗句排序'){
  const txt=picked.map(i=>q.lines[i]).join('／'),right=q.lines.join('／');
  detail='<div>你的顺序：'+esc(txt)+'</div>';
 }else if(q.type==='作者作品连线'){
  detail='<div>正确配对：'+q.answer.map(p=>esc(p[0]+'—'+p[1])).join('；')+'</div>';
 }
 if(ok){
  S.correct++;S.combo++;if(S.combo>S.maxCombo)S.maxCombo=S.combo;
  const sc=calcScore(q,sec,S.combo,usedHint);
  got=sc.total;S.score+=got;state.total+=got;state.week+=got;state.correct++;
  detail='<div class="small">得分：基础 '+sc.base+(sc.sp?' ＋速度 '+sc.sp:'')+(sc.cb?' ＋连击 '+sc.cb:'')+(sc.hint?' （用提示后减半）':'')+' ＝ <b class="kb">+'+got+'</b></div>';
  sfx('ok');
 }else{
  S.combo=0;
  sfx('no');
  state.wrong=state.wrong.filter(w=>w.q.id!==q.id);
  state.wrong.unshift({q:q,c:((state.wrong.find(w=>w.q.id===q.id)||{}).c||0)+1,t:Date.now()});
  if(state.wrong.length>200)state.wrong.length=200;
 }
 state.answered++;state.all[q.type]=(state.all[q.type]||0)+1;
 if(ok)state.ok[q.type]=(state.ok[q.type]||0)+1;
 if(S.mode==='wrong'&&ok){state.fixed++;state.wrong=state.wrong.filter(w=>w.q.id!==q.id);}
 if(S.mode==='feihua'&&ok){/* 连对轮数 */}
 S.maxCombo=Math.max(S.maxCombo||0,0);
 state.maxCombo=Math.max(state.maxCombo,S.combo);
 save();checkBadges();hud();
 const fb=$('#fb');
 fb.className='fb '+(ok?'ok':'no');
 fb.innerHTML='<h4>'+(ok?'✅ 答对了 +'+got+' 分':'❌ 答错了，已收入错题本')+'</h4>'
  +'<div>正确答案：<b class="kb">'+esc(q.type==='飞花令'?('含“'+q.key+'”的诗句，如：'+q.analysis.replace(/^.*如“/,'').replace(/”。.*$/,'')):(Array.isArray(q.answer)&&q.type==='诗句排序'?q.answer.join('／'):(q.type==='作者作品连线'?q.answer.map(p=>p[0]+'—'+p[1]).join('；'):q.answer)))+'</b></div>'
  +'<div>出处：《'+esc(q.poem)+'》（'+esc(q.author)+'·'+esc(q.dynasty)+'）</div>'
  +'<div>易错字：<span class="kb">'+esc(q.typos||'—')+'</span></div>'
  +detail
  +'<div style="margin-top:6px">'+esc(q.analysis)+'</div>';
 $('#b-hint').disabled=true;$('#b-sub').style.display='none';
 const last=(S.mode==='level'&&S.idx>=S.queue.length-1)||(S.mode==='feihua'&&!ok)||(S.mode==='wrong'&&S.idx>=S.queue.length-1);
 $('#b-next').style.display='';$('#b-next').textContent=last?'查看结算 →':'下一题 →';
}

 if(S.mode==='feihua'){

 }

/* ==================== 结算 ==================== */
function endSession(byTime){
 if(!S)return;
 clearInterval(timer);
 const done=S.idx+(S.mode==='limit'?0:0);
 let extra=0,extraTxt=[];
 if(S.mode==='level'){
  const allDone=S.idx>=S.queue.length&&answerLocked;
  if(allDone){
   extra+=20;extraTxt.push('完成一关 +20');
   if(S.correct===S.queue.length){extra+=30;extraTxt.push('单关满分 +30');state.full=true;
    const st=3;state.stars[S.level]=Math.max(state.stars[S.level]||0,3);}
   else{
    const acc=S.correct/S.queue.length,st=acc>=.8?2:acc>=.6?1:0;
    state.stars[S.level]=Math.max(state.stars[S.level]||0,st);
   }
   if(S.correct/S.queue.length>=.6)state.cleared[S.level]=true;
  }
 }else if(S.mode==='limit'){
  if(S.correct>=20&&state.limitBest<20)state.limitBest=S.correct;
 }
 if(S.mode==='feihua'){
  state.fhBest=Math.max(state.fhBest,S.correct);
 }
 state.total+=extra;state.week+=extra;
 const used=(Date.now()-S.t0)/1000;
 state.history.unshift({m:S.mode,lv:S.level,sc:S.score+extra,ok:S.correct,n:S.mode==='feihua'?S.correct:(S.queue.length),acc:S.mode==='feihua'?(S.correct?1:0):(S.correct/Math.max(1,S.queue.length)),combo:S.maxCombo,t:Math.round(used),d:today()});
 if(state.history.length>200)state.history.length=200;
 save();checkBadges();hud();sfx('win');
 const tot=S.score+extra;
 $('#res-box').innerHTML='<div class="ttl">本局结算</div><div class="sub">'+esc(S.title)+'</div>'
  +'<div style="text-align:center;font-size:44px;color:#b0362c;margin:14px 0;letter-spacing:2px">'+tot+'<span style="font-size:16px"> 分</span></div>'
  +'<table><tr><th>答对</th><th>正确率</th><th>最高连击</th><th>用时</th><th>额外加分</th></tr><tr><td>'+S.correct+' / '+S.queue.length+'</td><td>'+(S.mode==='feihua'?'—':Math.round(S.correct/Math.max(1,S.queue.length)*100)+'%')+'</td><td>'+S.maxCombo+'</td><td>'+used.toFixed(1)+'s</td><td>'+(extraTxt.join('，')||'—')+'</td></tr></table>'
  +'<div class="small" style="margin-top:10px">'+esc(S.title)+'：本局答题得分 '+S.score+' 分'+(extra?'，额外奖励 '+extra+' 分':'')+'。</div>'
  +'<div class="qact"><button class="btn primary" onclick="again()">再来一局</button><button class="btn" onclick="go(\'home\')">返回首页</button><button class="btn ghost" onclick="go(\'wrong\')">查看错题本</button></div>';
 S=null;go('res');
}

   +'<button class="btn primary" onclick="saveCfg()">保存设置</button></div>'
   +'<table style="margin-top:12px"><tr><th>关卡</th><th>名称</th><th>题量</th><th>通关线</th></tr>'
   +LEVELS.map(l=>'<tr><td>第'+l.id+'关</td><td>'+l.n+'</td><td>'+pool(l.id).length+' 题可选</td><td>正确率≥60%</td></tr>').join('')+'</table>'
   +'<div class="small" style="margin-top:8px">分值规则固定为：易5／中10／难15，速度奖励+3／+5，连击+5／+10／+20，完成+20，满分+30；倍率将整体缩放题目基础分。</div>';
 }else if(i===2){
  B.innerHTML='<h4>题库导入 / 导出</h4><div style="display:flex;gap:8px;flex-wrap:wrap"><input type="file" id="file-bank" accept=".json" onchange="importBank(this)"><button class="btn" onclick="downloadBank()">导出当前题库</button><button class="btn" onclick="downloadTpl()">下载题库模板</button><button class="btn ghost" onclick="clearCustom()">清空自定义题</button></div>'
   +'<div class="small" style="margin-top:10px">导入格式：JSON 数组，每项需含 id、type、poem、author、dynasty、stem、answer、analysis；可选 options、typos、tags、difficulty（1/2/3）、level（1-5）、points。type 取值：上下句默写／情境默写／理解性选择／意象判断／手法辨析／作者作品连线／名句纠错／诗句排序／飞花令／作者作品。</div>'
   +'<textarea class="code" id="bank-json" placeholder="也可直接粘贴 JSON 后点击下方按钮导入"></textarea><button class="btn jade" onclick="importBankText()" style="margin-top:8px">从文本框导入</button>';
 }else if(i===3){
  B.innerHTML='<h4>成绩与排行榜管理</h4><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" onclick="exportCSV()">导出成绩 CSV</button><button class="btn" onclick="exportJSON()">导出数据 JSON</button><input type="file" id="file-score" accept=".json" onchange="importScore(this)"><button class="btn ghost" onclick="resetRank()">重置排行榜（清除导入成绩）</button></div>'
   +'<div class="small" style="margin-top:10px">导入班级成绩 JSON 格式：[{ "n":"姓名","a":"头像emoji","p":1200,"w":80,"b":6,"c":0.9,"m":12,"t":7.2 }]（p总积分／w本周积分／b徽章数／c正确率／m最高连击／t平均用时秒）。</div>'
   +'<table style="margin-top:10px"><tr><th>名次</th><th>昵称</th><th>总积分</th><th>正确率</th><th>最高连击</th></tr>'
   +boardRows('total').slice(0,10).map((r,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(r.n)+'</td><td>'+r.p+'</td><td>'+Math.round(r.c*100)+'%</td><td>'+r.m+'</td></tr>').join('')+'</table>';
 }else{
  B.innerHTML='<h4>飞花令判定词库</h4><div class="small">每行一句（可带标点，系统自动去标点比对）。当前收录 '+allLines().length+' 句。</div>'
   +'<textarea class="code" id="extra-fh" placeholder="每行一句，如：举头望明月，低头思故乡">'+(state.extra||[]).join('\n')+'</textarea>'
   +'<button class="btn jade" style="margin-top:8px" onclick="saveFh()">保存词库</button>';
 }
}
function saveCfg(){
 state.config.per=Math.max(3,Math.min(20,parseInt($('#cfg-per').value)||8));
 state.config.mult=Math.max(.5,Math.min(2,parseFloat($('#cfg-mult').value)||1));
 state.config.demo=$('#cfg-demo').checked;
 save();toast('设置已保存');renderHome();
}
function saveFh(){
 state.extra=($('#extra-fh').value||'').split(/\n/).map(s=>norm(s)).filter(s=>s.length>=4);
 save();toast('飞花令词库已更新，共 '+allLines().length+' 句');
}
function validQ(q){return q&&q.id&&q.type&&q.poem&&q.stem!=null&&q.answer!=null;}
function importBank(input){
 const f=input.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const arr=JSON.parse(r.result);const ok=arr.filter(validQ);ok.forEach(q=>{q.points=q.points||PTS[q.difficulty||2];q.level=q.level||1;});state.custom=(state.custom||[]).concat(ok);save();toast('成功导入 '+ok.length+' 道题');}catch(e){toast('JSON 解析失败，请检查格式');}};r.readAsText(f,'utf-8');
}
function importBankText(){try{const arr=JSON.parse($('#bank-json').value);const ok=arr.filter(validQ);ok.forEach(q=>{q.points=q.points||PTS[q.difficulty||2];q.level=q.level||1;});state.custom=(state.custom||[]).concat(ok);save();toast('成功导入 '+ok.length+' 道题');teachTab(2);}catch(e){toast('JSON 解析失败');}}
function clearCustom(){if(confirm('清空所有自定义导入的题目？')){state.custom=[];save();teachTab(2);}}
function dl(name,text,type){
 const b=new Blob([text],{type:type||'application/json;charset=utf-8'});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}
function downloadBank(){dl('诗词飞花题库_'+today()+'.json',JSON.stringify(allQ(),null,1));}
function downloadTpl(){dl('题库模板.json',JSON.stringify([{id:'A001',type:'上下句默写',level:1,poem:'劝学',author:'荀子',dynasty:'战国',stem:'补写名句：“锲而不舍，______。”',options:null,answer:'金石可镂',analysis:'出自《劝学》。原句：“锲而不舍，金石可镂。”易错字：镂。以雕刻设喻，强调坚持不懈。',typos:'镂',tags:'名句默写·劝学',difficulty:2,points:10}],null,1));}
function exportCSV(){
 let csv='名次,昵称,总积分,徽章数,正确率,最高连击,平均用时(s)\n';
 boardRows('total').forEach((r,i)=>{csv+=[i+1,'"'+String(r.n).replace(/"/g,'""')+'"',r.p,r.b,Math.round(r.c*100)+'%',r.m,r.t.toFixed(1)].join(',')+'\n';});
 dl('诗词飞花成绩_'+today()+'.csv','\ufeff'+csv,'text/csv;charset=utf-8');
}
function exportJSON(){
 dl('诗词飞花数据_'+today()+'.json',JSON.stringify({profile:{nick:state.nick,total:state.total,week:state.week,badges:state.badges,answered:state.answered,correct:state.correct,maxCombo:state.maxCombo},history:state.history,wrong:state.wrong.map(w=>w.q),rank:boardRows('total')},null,1));
}
function importScore(input){
 const f=input.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const arr=JSON.parse(r.result);state.imported=arr.map(d=>({n:d.n||'匿名',a:d.a||'🎓',p:+d.p||0,w:+d.w||0,b:+d.b||0,c:+d.c||0,m:+d.m||0,t:+d.t||8}));save();toast('已导入 '+state.imported.length+' 条成绩');teachTab(3);}catch(e){toast('解析失败');}};r.readAsText(f,'utf-8');
}
function resetRank(){if(confirm('确定重置排行榜？将清除导入的班级成绩（个人积分不受影响）。')){state.imported=[];save();teachTab(3);toast('排行榜已重置');}}
/* ==================== 启动 ==================== */
function boot(){
 daily();hud();renderHome();
 if(!state.nick){
  openMask('<div class="big">🏮</div><h2>欢迎来到诗词飞花</h2><p class="small">给自己起个诗意的昵称，开始高考古诗词闯关吧！</p><input class="fill" id="boot-nick" maxlength="12" placeholder="如：墨韵、青衿、江晚吟" style="margin-top:12px"><button class="btn primary" style="margin-top:12px" onclick="bootNick()">开始闯关</button>');
 }
 $$('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.s));
 document.addEventListener('keydown',e=>{if(e.key==='Enter'&&$('#s-quiz').classList.contains('on')&&$('#fb').innerHTML==='')submitAnswer();});
}
function bootNick(){const v=($('#boot-nick').value||'').trim().slice(0,12)||'墨客';state.nick=v;save();closeMask();renderHome();toast('欢迎你，'+v+'！每日首登已 +5 分');}
boot();
</script>
</body>
</html>
